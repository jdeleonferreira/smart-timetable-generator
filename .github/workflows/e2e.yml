name: Prueba de extremo a extremo

# Levanta SQL Server real, aplica la migración, carga los datos de ejemplo con el MigrationService,
# arranca la API y genera un horario completo. Si no existe la migración inicial, la crea y la sube a la rama.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "E2e_Password123!"
        ports:
          - 1433:1433

    env:
      ConnectionStrings__SmartTimetable: "Server=localhost,1433;Database=smart-timetable;User ID=sa;Password=E2e_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: "llave-de-la-prueba-e2e-con-mas-de-32-caracteres"
      InitialAdmin__Email: "admin@colegio.local"
      InitialAdmin__Password: "Admin2026"

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Build
      shell: bash
      run: |
        set -o pipefail
        dotnet build src/WebApi --configuration Release 2>&1 | tee build-output.txt
        dotnet build tools/MigrationService --configuration Release 2>&1 | tee -a build-output.txt

    - name: Crear la migración si el modelo cambió
      shell: bash
      run: |
        set -o pipefail
        dotnet tool install --global dotnet-ef --version 10.0.12
        ef="dotnet ef --configuration Release --no-build --project ./src/Infrastructure --startup-project ./src/WebApi"
        if ls src/Infrastructure/Persistence/Migrations/*.cs >/dev/null 2>&1; then
          if $ef migrations has-pending-model-changes 2>&1 | tee build-output.txt; then
            echo "La base de datos está al día con el modelo"
            exit 0
          fi
          # Nombre a partir de la rama: feature/autenticacion -> Autenticacion
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          name=$(echo "${branch##*/}" | sed -E 's/[^A-Za-z0-9]+/ /g; s/\b(.)/\u\1/g; s/ //g')
        else
          name=Initial
        fi
        $ef migrations add "$name" --output-dir ./Persistence/Migrations 2>&1 | tee build-output.txt
        dotnet build src/WebApi --configuration Release 2>&1 | tee build-output.txt
        dotnet build tools/MigrationService --configuration Release 2>&1 | tee -a build-output.txt
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/Infrastructure/Persistence/Migrations
        git commit -m "Migración $name (generada con dotnet ef)"
        git push origin HEAD:"${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        echo "::notice title=Migración::Migración $name creada y subida a ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

    - name: Aplicar migración y cargar datos de ejemplo
      shell: bash
      run: |
        set -o pipefail
        dotnet run --project tools/MigrationService --configuration Release --no-build 2>&1 | tee migration-output.txt

    - name: Arrancar la API y generar un horario
      shell: bash
      run: |
        set -euo pipefail
        dotnet run --project src/WebApi --configuration Release --no-build --no-launch-profile --urls http://localhost:5080 > api-output.txt 2>&1 &
        base=http://localhost:5080/api
        for i in $(seq 1 60); do curl -sf http://localhost:5080/health >/dev/null && break; sleep 2; done
        curl -s http://localhost:5080/health | tee health.txt; echo
        echo "::notice title=Health::$(cat health.txt)"
        curl -sf http://localhost:5080/openapi/v1.json | jq . > src/WebClient/openapi.json

        # Sin token: 401. Con token del administrador de ejemplo: todo lo demás.
        unauth=$(curl -s -o /dev/null -w '%{http_code}' $base/study-plans)
        login() { curl -sf -X POST $base/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"$1\",\"password\":\"$2\"}" | jq -r .accessToken; }
        token=$(login admin@colegio.local Admin2026)
        api() { curl -sf -H "Authorization: Bearer $token" "$@"; }
        status() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$@"; }
        me=$(api $base/auth/me | jq -c '{email, role}')
        echo "::notice title=Sesión::sin token=$unauth, admin=$me"
        [ "$unauth" = "401" ] && [ "$(echo "$me" | jq -r .role)" = "Admin" ]

        years=$(api $base/catalog/academic-years)
        yearId=$(echo "$years" | jq -r '.[0].id')
        periodId=$(echo "$years" | jq -r '.[0].periods[0].id')
        campusId=$(api $base/catalog/campuses | jq -r '.[0].id')
        courses=$(api "$base/catalog/courses?academicYearId=$yearId&campusId=$campusId")
        teachers=$(api $base/catalog/teachers)
        echo "::notice title=Datos de ejemplo::$(echo "$courses" | jq length) cursos, $(echo "$teachers" | jq length) docentes"

        # Plan de estudios por HTTP: consulta, agregar y quitar una asignatura, errores esperados
        echo "::notice title=Catálogo::$(api $base/grades | jq length) grados, $(api $base/areas | jq length) áreas"
        planId=$(api "$base/study-plans?academicYearId=$yearId&campusId=$campusId" | jq -r '.[0].id')
        plan=$(api $base/study-plans/$planId)
        echo "::notice title=Plan de estudios::$(echo "$plan" | jq -c '{name, status, totales: [.grades[] | "\(.shortName)=\(.weeklyTotal)"]}')"
        [ "$(echo "$plan" | jq -r '.status')" = "Draft" ]
        gradeId=$(echo "$plan" | jq -r '.grades[0].id')
        before=$(echo "$plan" | jq '.grades[0].weeklyTotal')
        freeSubject=$(echo "$plan" | jq -r --arg g "$gradeId" '[.areas[].subjects[] | select(all(.items[]; .gradeId != $g))][0].id')
        usedSubject=$(echo "$plan" | jq -r --arg g "$gradeId" '[.areas[].subjects[] | select(any(.items[]; .gradeId == $g))][0].id')
        item='{"gradeId":"'$gradeId'","subjectId":"'$freeSubject'","deliveryMode":"Regular","weeklyHours":1}'
        added=$(curl -s -o item.json -w '%{http_code}' -H "Authorization: Bearer $token" -X POST $base/study-plans/$planId/items -H 'Content-Type: application/json' -d "$item")
        after=$(api $base/study-plans/$planId | jq '.grades[0].weeklyTotal')
        removed=$(status -X DELETE $base/study-plans/$planId/items/$(jq -r .id item.json))
        dup='{"gradeId":"'$gradeId'","subjectId":"'$usedSubject'","deliveryMode":"Regular","weeklyHours":1}'
        duplicate=$(status -X POST $base/study-plans/$planId/items -H 'Content-Type: application/json' -d "$dup")
        bad='{"gradeId":"'$gradeId'","subjectId":"'$freeSubject'","deliveryMode":"Regular","weeklyHours":99}'
        invalid=$(status -X POST $base/study-plans/$planId/items -H 'Content-Type: application/json' -d "$bad")
        final=$(api $base/study-plans/$planId | jq '.grades[0].weeklyTotal')
        echo "::notice title=Plan por HTTP::agregar=$added total $before→$after, quitar=$removed total=$final, duplicado=$duplicate, IH inválida=$invalid"
        [ "$added" = "201" ] && [ "$after" = "$((before + 1))" ] && [ "$removed" = "204" ] && [ "$final" = "$before" ]
        [ "$duplicate" = "409" ] && [ "$invalid" = "400" ]

        timetableId=$(api -X POST $base/timetables -H 'Content-Type: application/json' \
          -d "{\"academicYearId\":\"$yearId\",\"campusId\":\"$campusId\",\"academicPeriodId\":\"$periodId\",\"name\":null}" | jq -r '.id')
        jobId=$(api -X POST "$base/timetables/$timetableId/generate?timeLimitSeconds=180" | jq -r '.jobId')

        for i in $(seq 1 60); do
          job=$(api $base/generation-jobs/$jobId)
          [ "$(echo "$job" | jq -r '.isFinished')" = "true" ] && break
          sleep 5
        done
        echo "$job" | jq .
        echo "::notice title=Generación::$(echo "$job" | jq -c '{status, message}')"

        lessons=$(api "$base/timetables/$timetableId/lessons")
        echo "::notice title=Clases ubicadas::$(echo "$lessons" | jq length)"
        firstCourse=$(echo "$courses" | jq -r '.[0].id')
        api "$base/timetables/$timetableId/lessons?courseId=$firstCourse" | jq -c '.[]' | head -40
        # Docente: ve el plan, no ve el borrador y no puede generar ni publicar
        adminToken=$token
        token=$(login docente@colegio.local Docente2026)
        teacherPlan=$(status $base/study-plans/$planId)
        teacherDraft=$(status "$base/timetables/$timetableId/lessons")
        teacherGenerate=$(status -X POST "$base/timetables/$timetableId/generate")
        teacherUsers=$(status $base/users)
        # Coordinador de la sede: puede editar el plan de su sede
        token=$(login coordinador@colegio.local Coordinador2026)
        coordinatorPlan=$(status -X PUT $base/study-plans/$planId -H 'Content-Type: application/json' -d "$(echo "$plan" | jq -c '{name, notes}')")
        coordinatorUsers=$(status $base/users)
        token=$adminToken
        echo "::notice title=Permisos::docente: plan=$teacherPlan borrador=$teacherDraft generar=$teacherGenerate usuarios=$teacherUsers; coordinador: editar plan=$coordinatorPlan usuarios=$coordinatorUsers"
        [ "$teacherPlan" = "200" ] && [ "$teacherDraft" = "404" ] && [ "$teacherGenerate" = "403" ] && [ "$teacherUsers" = "403" ]
        [ "$coordinatorPlan" = "204" ] && [ "$coordinatorUsers" = "403" ]

        publish=$(status -X POST $base/timetables/$timetableId/publish)
        echo "::notice title=Publicar::HTTP $publish"

        status=$(echo "$job" | jq -r '.status')
        [ "$status" = "Succeeded" ] || [ "$status" = "PartiallySucceeded" ]

    - name: Generar el cliente de la API (Kiota) si cambió el contrato
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error title=Cliente API::Falló (línea $LINENO): $BASH_COMMAND"' ERR
        # El manifiesto de herramientas puede estar en .config/ o en la raíz (según la versión del SDK)
        if [ ! -f .config/dotnet-tools.json ] && [ ! -f dotnet-tools.json ]; then
          dotnet new tool-manifest
          dotnet tool install Microsoft.OpenApi.Kiota
        fi
        if [ -f .config/dotnet-tools.json ]; then manifest=.config/dotnet-tools.json; else manifest=dotnet-tools.json; fi
        cd src/WebClient
        npm run api:generate 2>&1 | tee kiota-output.txt || { grep -iE "error|fail" kiota-output.txt | head -5 | sed 's/^/::error title=Kiota::/'; exit 1; }
        cd ../..
        if [ -z "$(git status --porcelain -- src/WebClient/openapi.json src/WebClient/src/api/generated "$manifest")" ]; then
          echo "El cliente de la API está al día"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/WebClient/openapi.json src/WebClient/src/api/generated "$manifest"
        git commit -m "Cliente de la API regenerado con Kiota"
        git push origin HEAD:"${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        echo "::notice title=Cliente API::Cliente regenerado y subido a ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/WebClient/package-lock.json

    - name: Cliente web contra la API real (Playwright)
      shell: bash
      working-directory: src/WebClient
      env:
        API_URL: http://localhost:5080
        E2E_BASE_URL: http://localhost:4173
      run: |
        set -o pipefail
        npm ci
        npx playwright install --with-deps chromium
        npm run build
        npx vite preview --port 4173 --strictPort > ../../web-preview.txt 2>&1 &
        for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
        npx playwright test --project=real 2>&1 | tee ../../playwright-output.txt
        echo "::notice title=Playwright::$(grep -E '[0-9]+ (passed|failed)' ../../playwright-output.txt | tr -s ' ' | paste -sd' ')"

    - name: Capturas del cliente web
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: web-real
        path: |
          src/WebClient/playwright-report
          src/WebClient/test-results
        if-no-files-found: ignore

    - name: Reportar fallos
      if: failure()
      shell: bash
      run: |
        touch build-output.txt migration-output.txt api-output.txt playwright-output.txt
        grep -E "✘|Error:|expect\(|Received|Expected" playwright-output.txt | head -12 | while IFS= read -r l; do echo "::error title=Playwright::${l//%/%25}"; done
        { grep -iE "error" build-output.txt | sort -u | head -15
          tail -5 build-output.txt
          grep -iE -A3 "fail|exception|error" migration-output.txt api-output.txt; } \
          | grep -v "^\s*$" | grep -v "^\s*at " | head -40 > failures.txt || true
        i=0
        while IFS= read -r line && [ $i -lt 10 ]; do
          echo "::error title=Fallo::${line//%/%25}"
          i=$((i+1))
        done < failures.txt
