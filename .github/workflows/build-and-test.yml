name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: "Build" 
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cache
      uses: actions/cache@v6
      with:    
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}    
        restore-keys: |      
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      shell: bash
      run: |
        set -o pipefail
        dotnet test --no-build --no-restore --configuration Release -- --report-xunit-trx 2>&1 | tee test-output.txt

    - name: Report test failures
      if: failure()
      shell: bash
      run: |
        # Publica las líneas relevantes como anotaciones (visibles en el resumen de la ejecución)
        grep -E -A6 "failed|Failed|error|Error|zero tests|Zero tests|exit code|Expected|Esperado|types failed" test-output.txt \
          | grep -v "^\s*$" | grep -v "^\s*at " | head -40 > failures.txt || true
        {
          echo "## Pruebas con fallos"
          echo '```'
          cat failures.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        i=0
        while IFS= read -r line && [ $i -lt 10 ]; do
          echo "::error title=Prueba::${line//%/%25}"
          i=$((i+1))
        done < failures.txt

    - name: Publish
      run: dotnet publish src/WebApi/WebApi.csproj --no-build --no-restore --configuration Release --output ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: published-files
        path: ./publish

    - name: Test Report
      uses: test-summary/action@v2
      if: success() || failure()
      with:
        paths: ./**/test-result.xml
        output: test-summary.md
    - name: Output job summary
      if: success() || failure()
      run: |
        cat test-summary.md >> $GITHUB_STEP_SUMMARY
